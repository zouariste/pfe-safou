services:
  db:
    image: postgres:17-alpine
    container_name: codeowl-clean-db
    environment:
      POSTGRES_DB: codeowl
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"   # optional, nur falls du von Host drauf willst
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codeowl"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codeowl-clean-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/codeowl
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SPRING_PROFILES_ACTIVE: dev
      JWT_SECRET: ${JWT_SECRET:-defaultDevSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm!!}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5175}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    ports:
      - "8080:8080"
    # Maven wird jetzt im Build ausgeführt → kein Volume mehr nötig
    # volumes:
    #   - ./backend:/app
    #   - ~/.m2:/root/.m2
    # command: ./mvnw spring-boot:run  # <- wird nicht mehr gebraucht!
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/codeowl/api}
        - VITE_BASE_PATH=${VITE_BASE_PATH:-/codeowl/}
    container_name: codeowl-clean-frontend
    depends_on:
      - backend
    ports:
      - "5175:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  snippet-ingest:
    # ENTWEDER eigenes Image benutzen …
    # image: snippet-ingest:latest
    # … ODER lokal bauen:
    build:
      context: ./snippet-ingest
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: codeowl
      SNIPPET_VERSION: "2"   # RQ5 nutzt v=2
    # Nur nötig, wenn du lokale Ordner als Quelle nutzt:
    volumes:
      #- ./local/mdn:/mnt/mdn:ro
      - ./snippet-ingest/repos.txt:/app/repos.txt:ro  
      # Optional: SSH-Keys für git@… Repos
      # - ~/.ssh:/root/.ssh:ro
    # ENTRYPOINT ist schon im Dockerfile gesetzt -> hier nicht nötig
    # command kannst du beim Run überschreiben, siehe unten
    profiles: ["manual"]   # startet NICHT automatisch bei `up`
    restart: "no"
  # 🧩 Neuer Analyse-Container
  analysis:
    build:
      context: ./codeowl_analysis
    container_name: codeowl-analysis
    depends_on:
      db:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: 1
    volumes:
      - ./codeowl_analysis/plots:/app/plots   # Plots auf Host verfügbar
    profiles: ["manual"]   # ← nur manuell starten
    command: ["python", "analysis.py"]
  analysis2:
    build:
      context: ./codeowl_analysis
    container_name: codeowl-analysis2
    depends_on:
      db:
        condition: service_healthy
    environment:        
      PYTHONUNBUFFERED: 1
    volumes:
      - ./codeowl_analysis/plots2:/app/plots   # separater Ordner für Plots von analysis2
    profiles: ["manual"]
    command: ["python", "analysis2.py"]
    
volumes:
  db_data: